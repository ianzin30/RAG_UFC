[model]
ufc_model_name = "llama3.1:8b"

[embeddings]
model_name = "BAAI/bge-m3"
device = "cpu"
quantization = "none"
batch_size = 2
max_length = 1024

[splitter]
chunk_size = 800
chunk_overlap = 150
separators = [
    "\n\n",
    "\n",
    ". ",
    "? ",
    "! ",
    "; ",
    ": ",
    "  ",
    " ",
    "",
]

[retrieval]
base_search_k = 12
base_fetch_k = 30
base_lambda_mult = 0.2
lexical_limit = 12
candidate_pool_limit = 30
llm_selection_limit = 8
llm_selector_enabled = true

[rag]
agent_mode = "crewai"
strict_grounding = true
min_evidence_score = 0.5
