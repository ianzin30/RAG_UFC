# Runtime configuration for the RAG system.
# All values here apply uniformly to every collection under data/collections/;
# nothing in this file is collection-specific.

[llm]
provider = "vllm"
model = "Qwen/Qwen2.5-7B-Instruct-AWQ"
# Bounded structured outputs by agent role; avoids local-model truncation.
role_max_output_tokens = { planner = 512, research = 384, reasoning = 768, answer = 768, verification = 512, source_focus = 384 }
temperature = 0.0
num_ctx = 8192
timeout_seconds = 420

[llm.providers.ollama]
base_url = "http://localhost:11434"
# Optional physical mapping, e.g. [llm.providers.ollama.models]
# "qwen3.5" = "qwen3.5:9b"

[llm.providers.vllm]
# Override with VLLM_BASE_URL when using another tunnel or a direct VPN route.
base_url = "http://127.0.0.1:8000/v1"

[rag_v2]
device = "cpu"
child_tokens = 384
parent_tokens = 1536
batch_size = 8
search_k = 30
rrf_k = 60
rerank_k = 30
max_hops = 3
queries_per_hop = 3
context_tokens = 3000
subset_cache_mb = 128



[llm_models]
# Runtime model selector options shown in the UI.
# The active provider must serve every model listed here.
options = [
    { label = "Qwen 2.5 7B (ATLab)", model_name = "Qwen/Qwen2.5-7B-Instruct-AWQ" },
]
