[project]
name = "rag-ufc"
version = "0.1.0"
description = "RAG project with Streamlit chat, scraping, Google Drive ingestion, and Telegram bot flows."
readme = "docs/README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "crewai",
    "docling",
    "faiss-cpu",
    "firecrawl",
    "google-api-python-client",
    "google-auth-httplib2",
    "google-auth-oauthlib",
    "httpx",
    "langchain-core",
    "numpy",
    "openai>=2.30.0,<3",
    "openpyxl",
    "pydantic",
    "pypdf",
    "python-dotenv",
    "python-telegram-bot",
    "requests",
    "rich",
    "sentence-transformers",
    "streamlit",
    "torch",
    "torchvision",
    "flagembedding==1.3.5",
    # The engine: developed here, released to applications as a versioned package.
    "rag-ufc-core[docling]",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/rag-ufc-core"]

[tool.uv.sources]
rag-ufc-core = { workspace = true }
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
