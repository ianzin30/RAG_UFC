[project]
name = "rag-ufc-core"
dynamic = ["version"]
description = "Reusable RAG engine (retrieval, reranking, evidence coverage, grounded generation) shared by RAG-UFC research and applications."
readme = "README.md"
requires-python = ">=3.11,<3.13"
# Behavior-sensitive libraries (agents, embeddings, ANN search, tokenizers) are bounded to
# the minor versions the approved pipeline was evaluated with; a wider range is a new release.
dependencies = [
    "crewai>=1.14.0,<1.15",
    "faiss-cpu>=1.13.2,<1.14",
    "flagembedding==1.3.5",
    "httpx>=0.28.1,<1",
    "huggingface-hub>=0.36.2,<1",
    "langchain-core>=1.2.26,<2",
    "numpy>=2.4.4,<2.5",
    "openai>=2.30.0,<3",
    "openpyxl>=3.1.5,<4",
    "pydantic>=2.11.10,<3",
    "pypdf>=6.9.2,<7",
    "python-dotenv>=1.1.1,<2",
    "requests>=2.33.1,<3",
    "sentence-transformers>=5.3.0,<5.4",
    "torch>=2.11.0,<2.12",
    "transformers>=4.57.6,<4.58",
]

[project.optional-dependencies]
# Docling converts PDF/Office/images to Markdown for ingestion; plain text, spreadsheets
# and pypdf extraction work without it.
docling = ["docling>=2.84.0,<2.85"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/rag_ufc_core/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_ufc_core"]

[tool.hatch.build.targets.sdist]
include = ["src/rag_ufc_core", "tests", "README.md", "pyproject.toml"]
