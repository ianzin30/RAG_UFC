[project]
name = "rag-ufc"
version = "0.1.0"
description = "RAG project with Streamlit chat, scraping, Google Drive ingestion, and Telegram bot flows."
readme = "docs/README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "bitsandbytes",
    "crewai",
    "docling",
    "faiss-cpu",
    "firecrawl",
    "google-api-python-client",
    "google-auth-httplib2",
    "google-auth-oauthlib",
    "langchain",
    "langchain-community",
    "langchain-huggingface",
    "openpyxl",
    "pypdf",
    "python-dotenv",
    "python-telegram-bot",
    "requests",
    "sentence-transformers",
    "streamlit",
    "torch",
    "torchvision",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
